name: Build apps

# Builds an Android debug APK and UNSIGNED iOS IPAs (sign them yourself with your own certificate),
# then publishes them as the "latest" release so they can be downloaded straight to a phone.
# Manual only: day-to-day builds run on Codemagic (codemagic.yaml). Start this one by hand from the Actions tab if ever needed.
# A tag named build-<anything> also starts it:  git tag build-1 && git push origin build-1
on:
  workflow_dispatch:
  push:
    tags: ['build-*']

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build number from the commit time (same on every CI, always increasing)
        run: echo "BUILD_NUMBER=$(( ($(git log -1 --format=%ct) - 1793491200) / 60 ))" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - name: Stamp the version shown inside the app
        run: sed -i.bak "s/APP_VER = 'dev'/APP_VER = '1.0.$BUILD_NUMBER'/" www/index.html && rm www/index.html.bak
      - run: npm run vendor
      - run: npx cap sync android
      - run: chmod +x gradlew && ./gradlew assembleDebug --console=plain
        working-directory: android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk baytna.apk
      - uses: actions/upload-artifact@v4
        with:
          name: baytna-android
          path: baytna.apk

  ios:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: plain          # the app only
            ipa: baytna-unsigned.ipa
          - variant: widgets        # the app + home-screen and lock-screen widgets
            ipa: baytna-widgets-unsigned.ipa
    steps:
      - uses: actions/checkout@v4
      - name: Build number from the commit time (same on every CI, always increasing)
        run: echo "BUILD_NUMBER=$(( ($(git log -1 --format=%ct) - 1793491200) / 60 ))" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Stamp the version shown inside the app
        run: sed -i.bak "s/APP_VER = 'dev'/APP_VER = '1.0.$BUILD_NUMBER'/" www/index.html && rm www/index.html.bak
      - run: npm run vendor
      - run: npx cap sync ios
      - name: Add the widget extension target
        if: matrix.variant == 'widgets'
        run: |
          gem install xcodeproj --no-document --user-install
          ruby scripts/add_ios_widget.rb
      - name: Archive without code signing
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -archivePath build/App.xcarchive archive \
            MARKETING_VERSION="1.0.$BUILD_NUMBER" CURRENT_PROJECT_VERSION="$BUILD_NUMBER"             CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee build.log | tail -n 40
      - name: Package unsigned IPA
        run: |
          mkdir Payload
          cp -R build/App.xcarchive/Products/Applications/App.app Payload/
          ls Payload/App.app/PlugIns 2>/dev/null || true
          zip -qry "${{ matrix.ipa }}" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ipa-${{ matrix.variant }}
          path: ${{ matrix.ipa }}
      - name: Keep the error lines when the build fails
        if: failure()
        run: |
          (grep -nE "error:|fatal|ARCHIVE FAILED" -A3 build.log || tail -n 150 build.log) > "ios-${{ matrix.variant }}-errors.txt"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: log-${{ matrix.variant }}
          path: ios-${{ matrix.variant }}-errors.txt

  release:
    needs: [android, ios]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la out
          # Never delete the previous release: new files replace old ones, anything that failed to build keeps its last good copy.
          gh release view latest >/dev/null 2>&1 || gh release create latest --target "$GITHUB_SHA" --title "Latest build" --notes "The IPA files are unsigned: sign them with your own certificate before installing."
          gh release upload latest out/* --clobber
