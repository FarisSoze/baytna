name: Build apps

# Builds an Android debug APK and an UNSIGNED iOS IPA (sign it yourself with your own certificate),
# then publishes both as the "latest" release so they can be downloaded straight to a phone.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'supabase/**', 'codemagic.yaml']

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run vendor
      - run: npx cap sync android
      - run: chmod +x gradlew && ./gradlew assembleDebug --console=plain
        working-directory: android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk baytna.apk
      - uses: actions/upload-artifact@v4
        with:
          name: baytna-android
          path: baytna.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run vendor
      - run: npx cap sync ios
      - name: Archive without code signing
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -archivePath build/App.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -n 60
      - name: Package unsigned IPA
        run: |
          mkdir Payload
          cp -R build/App.xcarchive/Products/Applications/App.app Payload/
          zip -qry baytna-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: baytna-ios-unsigned
          path: baytna-unsigned.ipa

  release:
    needs: [android, ios]
    if: ${{ always() && (needs.android.result == 'success' || needs.ios.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la out
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/* --target "$GITHUB_SHA" --title "Latest build" \
            --notes "Built from ${GITHUB_SHA::7}. The IPA is unsigned: sign it with your own certificate before installing."
