name: Build apps

# Builds the Android APK and ONE unsigned iPhone IPA (with the widgets); sign the IPA yourself before installing.
# Nothing builds on push. Start a build by hand from the Actions tab, or with a tag:  git tag build-1 && git push origin build-1
on:
  workflow_dispatch:
  push:
    tags: ['build-*']

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FONT_KEY: ${{ secrets.FONT_KEY }}     # unlocks the licensed typeface bundle; without it the app falls back to its old font

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build number from the commit time (same on every CI, always increasing)
        run: echo "BUILD_NUMBER=$(( ($(git log -1 --format=%ct) - 1793491200) / 60 ))" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - name: Stamp the version shown inside the app
        run: sed -i.bak "s/APP_VER = 'dev'/APP_VER = '1.1.$BUILD_NUMBER'/" www/index.html && rm www/index.html.bak
      - name: Unpack the typeface
        run: sh scripts/unpack_font.sh
      - run: npm run vendor
      - run: npx cap sync android
      - run: chmod +x gradlew && ./gradlew assembleDebug --console=plain
        working-directory: android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk baytna.apk
      - uses: actions/upload-artifact@v4
        with:
          name: baytna-android
          path: baytna.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build number from the commit time (same on every CI, always increasing)
        run: echo "BUILD_NUMBER=$(( ($(git log -1 --format=%ct) - 1793491200) / 60 ))" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Stamp the version shown inside the app
        run: sed -i.bak "s/APP_VER = 'dev'/APP_VER = '1.1.$BUILD_NUMBER'/" www/index.html && rm www/index.html.bak
      - name: Unpack the typeface
        run: sh scripts/unpack_font.sh
      - run: npm run vendor
      - run: npx cap sync ios
      - name: Add the widget extension target
        run: |
          gem install xcodeproj --no-document --user-install
          ruby scripts/add_ios_widget.rb
      - name: Archive and package without code signing
        run: sh scripts/ios_ipa.sh baytna-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: out/baytna-unsigned.ipa
      - name: Keep the error lines when the build fails
        if: failure()
        run: |
          (grep -nE "error:|fatal|ARCHIVE FAILED" -A3 build.log || tail -n 150 build.log) > ios-errors.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: log-ios
          path: ios-errors.txt

  release:
    needs: [android, ios]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la out
          # Never delete the previous release: new files replace old ones, anything that failed to build keeps its last good copy.
          gh release view latest >/dev/null 2>&1 || gh release create latest --target "$GITHUB_SHA" --title "Latest build" --notes "The IPA is unsigned: sign it with your own certificate before installing."
          rm -f out/ios-errors.txt
          gh release upload latest out/* --clobber
          # There is one iPhone file now (it includes the widgets); drop the old separate one once the new one is up.
          if [ -f out/baytna-unsigned.ipa ]; then gh release delete-asset latest baytna-widgets-unsigned.ipa --yes || true; fi
          # The app reads this title to tell whether a newer build exists. Only when both files are the new ones.
          N=$(( ($(date -d "$(gh api "repos/$GH_REPO/commits/$GITHUB_SHA" --jq .commit.committer.date)" +%s) - 1793491200) / 60 ))
          if [ -f out/baytna.apk ] && [ -f out/baytna-unsigned.ipa ]; then gh release edit latest --title "Baytna 1.1.$N (1.0.$N)"; fi
