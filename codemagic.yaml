# Codemagic: one manual build that produces the Android APK and both UNSIGNED iOS IPAs (sign them yourself with your own certificate).
# There is no automatic trigger on purpose: start a build from the Codemagic page when a batch of changes is ready.
workflows:
  baytna:
    name: Baytna (APK + unsigned IPAs)
    instance_type: mac_mini_m2
    max_build_duration: 40
    environment:
      node: 22
      java: 21
      xcode: latest
    scripts:
      - name: Version number
        script: |
          # Continues after the GitHub builds (which ended below 100), so Android accepts the update.
          echo "BUILD_NUMBER=$((BUILD_NUMBER + 100))" >> $CM_ENV
      - name: Install dependencies
        script: npm ci
      - name: Stamp the version shown inside the app
        script: sed -i.bak "s/APP_VER = 'dev'/APP_VER = '1.0.$BUILD_NUMBER'/" www/index.html && rm www/index.html.bak
      - name: Copy bundled assets
        script: npm run vendor
      - name: Android APK
        script: |
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug --console=plain
          mkdir -p "$CM_BUILD_DIR/out" && cp app/build/outputs/apk/debug/app-debug.apk "$CM_BUILD_DIR/out/baytna.apk"
      - name: iOS without widgets
        script: |
          npx cap sync ios
          sh scripts/ios_ipa.sh baytna-unsigned.ipa
      - name: iOS with home-screen and lock-screen widgets
        script: |
          gem install xcodeproj --no-document --user-install
          ruby scripts/add_ios_widget.rb
          sh scripts/ios_ipa.sh baytna-widgets-unsigned.ipa
    artifacts:
      - out/*.apk
      - out/*.ipa
