# Codemagic: one manual build that produces the Android APK and both UNSIGNED iOS IPAs (sign them yourself with your own certificate).
# There is no automatic trigger on purpose: start a build from the Codemagic page when a batch of changes is ready.
workflows:
  baytna:
    name: Baytna (APK + unsigned IPAs)
    instance_type: mac_mini_m2
    max_build_duration: 40
    environment:
      groups:
        - "خط"              # the variable group in Codemagic that holds FONT_KEY (never stored in this file)
      node: 22
      java: 21
      xcode: latest
    scripts:
      - name: Version number
        script: |
          # From the commit time, so numbers keep increasing whichever CI builds.
          echo "BUILD_NUMBER=$(( ($(git log -1 --format=%ct) - 1793491200) / 60 ))" >> $CM_ENV
          echo "APP_VERSION=$(tr -d ' \r\n' < VERSION)" >> $CM_ENV
      - name: Install dependencies
        script: npm ci
      - name: Stamp the version shown inside the app
        script: sed -i.bak -e "s/APP_VER = 'dev'/APP_VER = '$APP_VERSION'/" -e "s/APP_BUILD = 0;/APP_BUILD = $BUILD_NUMBER;/" www/index.html && rm www/index.html.bak
      - name: Unpack the typeface (needs the FONT_KEY variable set in Codemagic)
        script: sh scripts/unpack_font.sh
      - name: Copy bundled assets
        script: npm run vendor
      - name: Android APK
        script: |
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug --console=plain
          mkdir -p "$CM_BUILD_DIR/out" && cp app/build/outputs/apk/debug/app-debug.apk "$CM_BUILD_DIR/out/baytna.apk"
      - name: iPhone IPA, with the widgets
        script: |
          npx cap sync ios
          gem install xcodeproj --no-document --user-install
          ruby scripts/add_ios_widget.rb
          sh scripts/ios_ipa.sh baytna-unsigned.ipa
      - name: Publish to the public download links on GitHub (needs GITHUB_TOKEN in the same variable group)
        script: sh scripts/publish_release.sh
    artifacts:
      - out/*.apk
      - out/*.ipa
